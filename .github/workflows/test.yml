name: test
#
# The suite itself lives in .tests/ and is described by .tests/README.md; this
# file only supplies the git-subrepo versions it should be run against. Nothing
# here does work of its own, so a green run locally and a green run here mean
# the same thing.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every layer, through the orchestrator. Linux only: the harness is written
  # for bash 4, and macOS ships bash 3.2. The scripts that ship to consumers
  # (the installer, diff, deps.sh, sync) are written for 3.2 and exercised on
  # macOS below.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install git-subrepo
        run: |
          git clone --quiet --branch 0.4.9 --depth 1 \
            https://github.com/ingydotnet/git-subrepo "$HOME/.git-subrepo"
          echo "$HOME/.git-subrepo/lib" >> "$GITHUB_PATH"
      - run: bash .tests/harness/run-all.sh

  # The consumer-facing scripts on the bash macOS actually ships. The harness
  # cannot run there, so this is the one test file that needs nothing from it
  # beyond runner.sh.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash --version
      - run: bash scripts/.tests/install-release.sh
      - run: bash dependency/release/.tests/deps.sh

  # An install hand-writes its .gitrepo, so git-subrepo's assumptions about that
  # file are a dependency of ours that nothing else would notice changing. This
  # job is allowed to fail: it is an early warning about an unreleased
  # git-subrepo, not a gate on merging.
  git-subrepo-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install git-subrepo from main
        run: |
          git clone --quiet --branch main --depth 1 \
            https://github.com/ingydotnet/git-subrepo "$HOME/.git-subrepo"
          echo "$HOME/.git-subrepo/lib" >> "$GITHUB_PATH"
      - run: bash .tests/harness/run-all.sh
